<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Ball Clash Z</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020;color:white;font-family:Arial}canvas{display:block;width:100%;height:100%;touch-action:none}#start{position:fixed;inset:0;display:grid;place-items:center;background:#0b1020;font-size:30px;font-weight:bold}button{font-size:22px;padding:16px 28px;border:0;border-radius:14px;background:#2563eb;color:white}</style></head><body><canvas id="c"></canvas><div id="start"><button>START BALL CLASH Z</button></div><script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,p,en=[],shots=[],score=0,coins=0,running=false,keys={};function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight}addEventListener('resize',resize);resize();
function spawn(){en.push({x:Math.random()*W,y:80+Math.random()*(H*.45),hp:2,r:22,s:.7+Math.random()*.6})}
function reset(){p={x:W/2,y:H*.72,hp:10,r:18,cd:0};en=[];shots=[];score=coins=0;for(let i=0;i<3;i++)spawn()}
function fire(){if(p.cd>0)return;let e=en.sort((a,b)=>(a.x-p.x)**2+(a.y-p.y)**2-(b.x-p.x)**2-(b.y-p.y)**2)[0];if(!e)return;let a=Math.atan2(e.y-p.y,e.x-p.x);shots.push({x:p.x,y:p.y,vx:Math.cos(a)*9,vy:Math.sin(a)*9});p.cd=14}
function loop(){if(!running)return;x.clearRect(0,0,W,H);x.fillStyle='#121a33';x.fillRect(0,0,W,H);for(const e of en){let a=Math.atan2(p.y-e.y,p.x-e.x);e.x+=Math.cos(a)*e.s;e.y+=Math.sin(a)*e.s;x.fillStyle='#ef4444';x.beginPath();x.arc(e.x,e.y,e.r,0,7);x.fill();if(Math.hypot(e.x-p.x,e.y-p.y)<e.r+p.r){p.hp-=.02}}
for(const s of shots){s.x+=s.vx;s.y+=s.vy;x.fillStyle='#38bdf8';x.beginPath();x.arc(s.x,s.y,7,0,7);x.fill();for(const e of en)if(Math.hypot(s.x-e.x,s.y-e.y)<e.r+7){e.hp--;s.x=-99;if(e.hp<=0){score++;coins+=5;e.dead=1}}}en=en.filter(e=>!e.dead);if(en.length<3+Math.floor(score/10))spawn();p.cd=Math.max(0,p.cd-1);x.fillStyle='white';x.font='18px Arial';x.fillText('❤️ '+Math.max(0,p.hp|0)+'   ⭐ '+score+'   🪙 '+coins,16,30);x.fillStyle='#22c55e';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();requestAnimationFrame(loop)}
c.addEventListener('pointerdown',e=>{if(e.target===c){fire()}});document.getElementById('start').onclick=()=>{document.getElementById('start').style.display='none';reset();running=true;loop()};addEventListener('keydown',e=>{if(e.code==='Space')fire()});
</script></body></html>
